/* Layout: single-column phone app shell (max 560px), sticky header per view, fixed bottom tab bar. */

:root[data-theme="dark"] {

  --line: #2a303d; --accent: #ff7a2e; --accent-fg: #1a0d04; --accent-soft: #3a2216;
  --p: #f06595; --c: #4dabf7; --f: #fcc419; --good: #51cf66; --danger: #ff6b6b;

* { box-sizing: border-box; }

#view { display: flex; flex-direction: column; gap: 14px; }

.top h1, .title-in { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.05; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }

/* Summary ring */
.summary { display: grid; grid-template-columns: 132px 1fr; gap: 6px 18px; align-items: center; }
.ring { width: 132px; height: 132px; }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 12; }

.sum-side { display: flex; flex-direction: column; gap: 8px; }

.mb.p i { background: var(--p); } .mb.c i { background: var(--c); } .mb.f i { background: var(--f); }
.mb.p .lbl span:first-child { color: var(--p); } .mb.c .lbl span:first-child { color: var(--c); } .mb.f .lbl span:first-child { color: var(--f); }

/* Rows */
.meal-h, .ex-h, .routine-h { display: flex; align-items: center; gap: 10px; }

.rows { list-style: none; margin: 8px 0 0; padding: 0; }

.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 2px; background: none; border: 0; text-align: left; cursor: pointer; }

.row-cal { font-weight: 600; font-variant-numeric: tabular-nums; }

.sets { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }

.chart .barr { fill: var(--accent); opacity: .85; }

.inline-form { display: flex; gap: 8px; margin-top: 10px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }

.stack { display: flex; flex-direction: column; gap: 12px; }

.check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.pick-list { max-height: 46vh; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }

.stepper { display: flex; align-items: center; gap: 8px; }

.macro-line { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; font-variant-numeric: tabular-nums; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }

#restbar .t { font-family: var(--display); font-size: 26px; font-weight: 700; flex: 1; font-variant-numeric: tabular-nums; }
#restbar .t small { font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .7; margin-right: 8px; }

#toast { position: fixed; z-index: 40; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 400px) {

  ['Barbell Curl', 'Arms'], ['Hammer Curl', 'Arms'], ['Triceps Pushdown', 'Arms'], ['Skull Crusher', 'Arms'],
  ['Plank', 'Core'], ['Hanging Leg Raise', 'Core'], ['Cable Crunch', 'Core']
].map(([name, muscle]) => ({ id: 'x-' + slug(name), name, muscle }));

function defaults() {
  return {
    v: 1,
    meta: { example: false },
    settings: { units: 'lb', rest: 120, goals: { cal: 2400, p: 180, c: 250, f: 75 }, profile: { sex: 'm', age: 30, cm: 178, act: 1.55, goal: 'cut' } },
    foods: FOODS.map(f => ({ ...f })),
    exercises: EXERCISES.map(e => ({ ...e })),
    routines: [
      { id: uid(), name: 'Push', exercises: ['x-bench-press', 'x-overhead-press', 'x-incline-dumbbell-press', 'x-lateral-raise', 'x-triceps-pushdown'] },
      { id: uid(), name: 'Pull', exercises: ['x-deadlift', 'x-pull-up', 'x-barbell-row', 'x-face-pull', 'x-barbell-curl'] },
      { id: uid(), name: 'Legs', exercises: ['x-back-squat', 'x-romanian-deadlift', 'x-leg-press', 'x-leg-curl', 'x-calf-raise'] }
    ],
    log: {}, workouts: [], weights: [], active: null
  };
}

function entryFrom(f, meal, qty) {
  return { id: uid(), meal, name: f.name, serving: f.serving, qty, cal: f.cal, p: f.p, c: f.c, f: f.f, foodId: f.id };
}

function seed() {
  const s = defaults(); s.meta.example = true;
  const t = today();
  for (let i = 40; i >= 0; i--) {
    if (i % 2 && i > 4) continue;
    s.weights.push({ date: addDays(t, -i), kg: r1(82.1 + i * 0.055 + Math.sin(i * 1.7) * 0.3) });
  }
  const F = n => s.foods.find(f => f.name === n);
  const plan = [['Breakfast', 'Oats, dry', 1.5], ['Breakfast', 'Whey protein', 1], ['Breakfast', 'Banana', 1],
    ['Lunch', 'Chicken breast, cooked', 2], ['Lunch', 'White rice, cooked', 1.5], ['Lunch', 'Broccoli', 1],
    ['Dinner', 'Salmon, cooked', 1.5], ['Dinner', 'Sweet potato, baked', 1.5], ['Dinner', 'Avocado', 1],
    ['Snacks', 'Greek yogurt, nonfat', 1], ['Snacks', 'Almonds', 1], ['Snacks', 'Blueberries', 1]];
  for (let i = 6; i >= 0; i--) {
    const k = addDays(t, -i); s.log[k] = [];
    plan.forEach(([meal, n, q], j) => {
      if (i === 0 && (meal === 'Dinner' || j === 11)) return;
      if ((i * 3 + j) % 7 === 2) return;
      s.log[k].push(entryFrom(F(n), meal, q));
    });
  }
  // Seed weights are written in pounds (plate-friendly numbers) and stored in kg.
  const tmpl = {
    Push: [['x-bench-press', 175, [8, 8, 7]], ['x-overhead-press', 110, [8, 7, 6]], ['x-incline-dumbbell-press', 60, [10, 10, 9]], ['x-lateral-raise', 20, [15, 14, 12]], ['x-triceps-pushdown', 65, [12, 12, 10]]],
    Pull: [['x-deadlift', 315, [5, 5, 5]], ['x-pull-up', 0, [10, 9, 8]], ['x-barbell-row', 155, [8, 8, 8]], ['x-face-pull', 45, [15, 15, 15]], ['x-barbell-curl', 65, [10, 9, 8]]],
    Legs: [['x-back-squat', 245, [6, 6, 5]], ['x-romanian-deadlift', 225, [8, 8, 8]], ['x-leg-press', 450, [10, 10, 10]], ['x-leg-curl', 100, [12, 11, 10]], ['x-calf-raise', 180, [12, 12, 12]]]
  };
  const order = ['Push', 'Pull', 'Legs'];
  let n = 0;
  for (let i = 26; i >= 1; i -= 2) {
    const name = order[n % 3], cycle = Math.floor(n / 3);
    const d = parseDay(addDays(t, -i)); d.setHours(17, 30);
    s.workouts.push({
      id: uid(), name, start: d.getTime(), dur: 3300 + (n % 4) * 300,
      exercises: tmpl[name].map(([ex, w, reps]) => ({ ex, sets: reps.map(r => ({ w: w ? (w + cycle * (w >= 100 ? 5 : 2.5)) / LB : 0, r, done: true })) }))
    });
    n++;
  }
  return s;
}

// ---------- state ----------
function load() { try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { /* storage unavailable */ } return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function normalize(s) {
  const d = defaults();
  s = s && typeof s === 'object' ? s : d;
  for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
  s.settings = { ...d.settings, ...s.settings, goals: { ...d.settings.goals, ...(s.settings || {}).goals }, profile: { ...d.settings.profile, ...(s.settings || {}).profile } };
  return s;
}
let S = normalize(load() || seed());
const ui = { tab: 'today', day: today(), rest: null, confirmDiscard: false, confirmReset: false, sheet: null };

// ---------- units / formatting ----------
const U = () => S.settings.units;
const toDisp = kg => U() === 'lb' ? Math.round(kg * LB * 10) / 10 : Math.round(kg * 10) / 10;
const fromDisp = v => U() === 'lb' ? v / LB : v;
const fmtVol = kg => { const v = U() === 'lb' ? kg * LB : kg; return (v >= 10000 ? r1(v / 1000) + 'k' : Math.round(v).toLocaleString()) + ' ' + U(); };
const fmtDur = s => { const m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min'; };
const fmtClock = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(x); };
const fmtDate = ms => new Date(ms).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtQty = q => (Math.round(q * 100) / 100).toString();
const exName = id => (S.exercises.find(e => e.id === id) || { name: 'Unknown exercise' }).name;
const e1rm = (w, r) => r <= 0 ? 0 : r === 1 ? w : w * (1 + r / 30);
const vol = w => w.exercises.reduce((a, e) => a + e.sets.reduce((b, s) => b + (Number(s.w) || 0) * (Number(s.r) || 0), 0), 0);

// ---------- nutrition ----------
const dayEntries = k => S.log[k] || [];
function totals(k) {
  return dayEntries(k).reduce((a, e) => ({ cal: a.cal + e.cal * e.qty, p: a.p + e.p * e.qty, c: a.c + e.c * e.qty, f: a.f + e.f * e.qty }), { cal: 0, p: 0, c: 0, f: 0 });
}

function macroBar(label, cls, v, g) {
  const pct = g ? Math.min(100, v / g * 100) : 0;
  return `<div class="mb ${cls}"><div class="lbl"><span>${label}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="val">${Math.round(v)} / ${g} g</div><div class="val">${v > g ? Math.round(v - g) + ' g over' : Math.round(g - v) + ' g left'}</div></div>`;
}

function dayLabel(k) {
  if (k === today()) return 'Today';
  if (k === addDays(today(), -1)) return 'Yesterday';
  return parseDay(k).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

function mealCard(k, m) {

      <span class="row-cal">${Math.round(e.cal * e.qty)}</span></button></li>`).join('')}</ul>` : `<p class="empty">Nothing logged yet.</p>`}

// ---------- training ----------
function prevSets(ex) {
  const ws = [...S.workouts].sort((a, b) => b.start - a.start);
  for (const w of ws) { const e = w.exercises.find(x => x.ex === ex); if (e) return e.sets; }
  return [];
}
function bestFor(ex, workouts) {
  let best = null;
  for (const w of workouts) for (const e of w.exercises) if (e.ex === ex) for (const s of e.sets) {
    const v = e1rm(Number(s.w) || 0, Number(s.r) || 0);
    if (!best || v > best.v || (v === best.v && s.r > best.r)) best = { v, w: Number(s.w) || 0, r: Number(s.r) || 0, date: w.start };
  }
  return best;
}
const weekStart = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };

function viewTrain() { return S.active ? viewActive() : viewTrainHome(); }

      <p class="muted">${r.exercises.map(id => esc(exName(id))).join(' · ') || 'No exercises'}</p>

      <span class="row-main"><span class="row-name">${esc(w.name)}</span><span class="row-sub">${fmtDate(w.start)} · ${fmtDur(w.dur)} · ${w.exercises.reduce((a, e) => a + e.sets.length, 0)} sets</span></span>
      <span class="row-cal">${fmtVol(vol(w))}</span></button></li>`).join('')}</ul>` : '<p class="empty" style="margin:0">Finished workouts show up here.</p>'}</section>`;
}

function exCard(e, i) {

        <input id="r-${i}-${j}" inputmode="numeric" class="num" data-in="setR" data-i="${i}" data-j="${j}" value="${s.r ?? ''}" placeholder="${pv(j, p => p.r)}" aria-label="Set ${j + 1} reps">

  </section>`;
}

function newActive(name, exIds) {
  S.active = { name, start: Date.now(), exercises: exIds.map(ex => ({ ex, sets: blankSets(ex) })) };
  ui.confirmDiscard = false;
  save(); go('train');
}
function blankSets(ex) { const n = Math.max(3, prevSets(ex).length || 0); return Array.from({ length: Math.min(n, 6) }, () => ({ w: '', r: '', done: false })); }

function finishWorkout() {
  const a = S.active;
  const exercises = a.exercises.map(e => ({ ex: e.ex, sets: e.sets.filter(s => Number(s.r) > 0).map(s => ({ w: Number(s.w) || 0, r: Number(s.r), done: true })) })).filter(e => e.sets.length);
  if (!exercises.length) { toast('Log at least one set with reps before finishing.'); return; }
  const w = { id: uid(), name: a.name.trim() || 'Workout', start: a.start, dur: Math.round((Date.now() - a.start) / 1000), exercises };
  const prs = [];
  for (const e of exercises) {
    const before = bestFor(e.ex, S.workouts), now = bestFor(e.ex, [w]);
    if (now && now.w > 0 && (!before || now.v > before.v + 0.01)) prs.push(exName(e.ex));
  }
  S.workouts.push(w); S.active = null; ui.rest = null;
  save(); render();
  toast(prs.length ? `Workout saved. New best: ${prs.slice(0, 2).join(', ')}${prs.length > 2 ? ' +' + (prs.length - 2) : ''}` : `Workout saved · ${fmtVol(vol(w))} lifted`);
}

// ---------- progress ----------
function niceTicks(min, max, n = 3) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}

function lineChart(pts) {
  const W = 340, H = 150, L = 34, Rr = 10, T = 10, B = 22;
  if (pts.length < 2) return '<p class="empty">Log your weight on two or more days to see a trend.</p>';
  const xs = pts.map(p => p.t), ys = pts.map(p => p.v);
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1], x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => L + (t - x0) / (x1 - x0 || 1) * (W - L - Rr), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  const fd = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight trend">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"></line><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`).join('')}
    <path class="area" d="${d} L${X(last.t).toFixed(1)} ${H - B} L${X(pts[0].t).toFixed(1)} ${H - B} Z"></path>
    <path class="line" d="${d}"></path>
    <circle class="dot" cx="${X(last.t)}" cy="${Y(last.v)}" r="4.5"></circle>
    <text x="${L}" y="${H - 6}">${fd(x0)}</text><text x="${W - Rr}" y="${H - 6}" text-anchor="end">${fd(x1)}</text>
  </svg>`;
}

function barChart(items, goal, label) {
  const W = 340, H = 150, L = 38, Rr = 6, T = 10, B = 22;
  const max = Math.max(goal || 0, ...items.map(i => i.v), 1);
  const ticks = niceTicks(0, max);
  const top = ticks[ticks.length - 1];
  const Y = v => T + (1 - v / top) * (H - T - B);
  const bw = (W - L - Rr) / items.length;
  const fmtT = v => v >= 1000 ? r1(v / 1000) + 'k' : v;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"></line><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${fmtT(v)}</text>`).join('')}
    ${items.map((it, i) => `<rect class="barr ${it.dim ? 'dim' : ''}" x="${(L + i * bw + bw * 0.18).toFixed(1)}" y="${Y(it.v).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${(H - B - Y(it.v)).toFixed(1)}" rx="3"></rect>
      <text x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(it.label)}</text>`).join('')}
    ${goal ? `<line class="goal" x1="${L}" x2="${W - Rr}" y1="${Y(goal)}" y2="${Y(goal)}"></line>` : ''}
  </svg>`;
}

function viewProgress() {
  const ws = [...S.weights].sort((a, b) => a.date < b.date ? -1 : 1);
  const recent = ws.filter(w => w.date >= addDays(today(), -90));
  const cur = ws[ws.length - 1];
  const ref = ws.find(w => w.date >= addDays(today(), -30));
  const delta = cur && ref ? toDisp(cur.kg) - toDisp(ref.kg) : 0;

  const wk0 = weekStart(Date.now());
  const weeks = Array.from({ length: 8 }, (_, i) => { const s = wk0 - (7 - i) * 7 * 864e5; return { s, e: s + 7 * 864e5 }; });
  const wkItems = weeks.map((w, i) => {
    const v = S.workouts.filter(x => x.start >= w.s && x.start < w.e).reduce((a, x) => a + vol(x), 0);
    return { label: i === 7 ? 'Now' : new Date(w.s).toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' }), v: U() === 'lb' ? v * LB : v };
  });

  const days = Array.from({ length: 7 }, (_, i) => addDays(today(), i - 6));
  const logged = days.filter(k => dayEntries(k).length);
  const avg = key => logged.length ? logged.reduce((a, k) => a + totals(k)[key], 0) / logged.length : 0;
  const g = S.settings.goals;
  const calItems = days.map(k => ({ label: parseDay(k).toLocaleDateString(undefined, { weekday: 'narrow' }), v: totals(k).cal, dim: k === today() }));

  const exIds = [...new Set(S.workouts.flatMap(w => w.exercises.map(e => e.ex)))];
  const prs = exIds.map(id => ({ id, b: bestFor(id, S.workouts) })).filter(x => x.b).sort((a, b) => b.b.v - a.b.v);

  return `

      <div class="stat"><b>${cur && ref ? (delta > 0 ? '+' : '') + r1(delta) : '—'}</b><span>${U()} / 30 days</span></div>
    </div>
    ${lineChart(recent.map(w => ({ t: parseDay(w.date).getTime(), v: toDisp(w.kg) })))}
    <form class="inline-form" data-form="weight">
      <input id="bwIn" inputmode="decimal" placeholder="Today's weight (${U()})" aria-label="Today's weight in ${U()}">
      <button class="btn primary" type="submit">Log</button>
    </form>
  </section>
  <section class="card">
    <h2>Weekly volume</h2>
    <p class="hint">Total ${U()} lifted per week (weight × reps).</p>
    ${barChart(wkItems, 0, 'Weekly training volume')}
  </section>
  <section class="card">
    <h2>Last 7 days</h2>
    <div class="stat-row">
      <div class="stat"><b>${Math.round(avg('cal')).toLocaleString()}</b><span>avg kcal</span></div>
      <div class="stat"><b>${Math.round(avg('p'))}</b><span>avg protein g</span></div>
      <div class="stat"><b>${logged.length}/7</b><span>days logged</span></div>
    </div>
    ${barChart(calItems, g.cal, 'Daily calories against goal')}
    <p class="hint">Dashed line is your ${g.cal.toLocaleString()} kcal goal. Today is shown faded until the day ends.</p>
  </section>
  <section class="card">
    <h2>Personal bests</h2>

    ${prs.length ? prs.slice(0, 12).map(x => `<div class="pr"><span>${esc(exName(x.id))}</span><span class="muted num">${x.b.w ? `${toDisp(x.b.w)} × ${x.b.r} · <b>${Math.round(toDisp(x.b.v))} ${U()}</b>` : `<b>${x.b.r} reps</b> bodyweight`}</span></div>`).join('') : '<p class="empty">Finish a workout to see your bests.</p>'}
  </section>`;
}

// ---------- toast / timers ----------
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }
function beep() {
  try {
    const A = window.AudioContext || window.webkitAudioContext; const a = new A();
    [0, 0.25].forEach(off => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(0.18, a.currentTime + off); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + off + 0.2); o.start(a.currentTime + off); o.stop(a.currentTime + off + 0.2); });
  } catch (e) { /* audio unavailable */ }
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { /* no vibration */ }
}
function startRest() { if (S.settings.rest > 0) ui.rest = { end: Date.now() + S.settings.rest * 1000, total: S.settings.rest }; tick(); }
function tick() {
  const el = $('#elapsed'); if (el && S.active) el.textContent = fmtClock((Date.now() - S.active.start) / 1000);
  const bar = $('#restbar');
  if (ui.rest) {
    const left = (ui.rest.end - Date.now()) / 1000;
    if (left <= 0) { ui.rest = null; bar.hidden = true; beep(); toast('Rest done. Next set.'); return; }
    bar.hidden = false; $('#restT').textContent = fmtClock(Math.ceil(left));
    $('#restP').style.width = Math.max(0, Math.min(100, left / ui.rest.total * 100)) + '%';
  } else bar.hidden = true;
}
setInterval(tick, 500);

// ---------- render / routing ----------
const TABS = ['today', 'train', 'progress', 'you'];
function go(tab) {
  ui.tab = tab; if (location.hash !== '#' + tab) { try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; } }
  render(); window.scrollTo(0, 0);
}
function render() {
  document.querySelectorAll('.nav button').forEach(b => { b.classList.toggle('on', b.dataset.tab === ui.tab); b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'); });
  $('#liveDot').className = S.active ? 'live' : '';
  const v = { today: viewToday, train: viewTrain, progress: viewProgress, you: viewYou }[ui.tab]();
  const banner = S.meta.example ? `<div class="banner"><span>These are example entries so you can see how it works.</span><button type="button" class="btn small" data-act="clearExamples">Start fresh</button></div>` : '';
  $('#view').innerHTML = banner + v;
  tick();
}
function fromHash() { const h = location.hash.slice(1); ui.tab = TABS.includes(h) ? h : (S.active ? 'train' : 'today'); render(); }
window.addEventListener('hashchange', fromHash);

// ---------- actions ----------
const num = (id, d = 0) => { const v = parseFloat(($('#' + id) || {}).value); return isFinite(v) ? v : d; };
const acts = {
  tab: el => go(el.dataset.tab),
  day: el => { const k = addDays(ui.day, +el.dataset.n); if (k <= today()) { ui.day = k; render(); } },
  clearExamples: () => { const keep = S; S = defaults(); S.settings = keep.settings; S.routines = keep.routines; S.foods = keep.foods.map(f => ({ ...f, used: 0 })); S.exercises = keep.exercises; save(); render(); toast('Examples cleared. Log your first meal or workout.'); },
  copyPrev: () => { const src = dayEntries(addDays(ui.day, -1)); S.log[ui.day] = src.map(e => ({ ...e, id: uid() })); save(); render(); toast(`Copied ${src.length} items`); },
  addFood: el => { Object.assign(add, { meal: el.dataset.meal, tab: 'search', q: '', pick: null, qty: 1 }); openSheet(sheetAddFood); setTimeout(() => { const i = $('#foodQ'); i && matchMedia('(pointer:fine)').matches && i.focus(); }, 50); },
  addTab: el => { add.tab = el.dataset.t; add.pick = null; drawSheet(); },
  pickFood: el => { add.pick = el.dataset.id; add.qty = 1; drawSheet(); },
  unpick: () => { add.pick = null; drawSheet(); },
  qtyStep: el => { const i = $('#qty'); const v = Math.max(0.25, Math.round(((parseFloat(i.value) || 0) + +el.dataset.n) * 100) / 100); i.value = v; ins.qty(i); },
  confirmFood: () => {
    const f = S.foods.find(x => x.id === add.pick); const q = num('qty', 1);
    if (q <= 0) { toast('Enter how many servings you had.'); return; }
    (S.log[ui.day] ||= []).push(entryFrom(f, add.meal, q)); f.used = Date.now();
    save(); closeSheet(); render(); toast(`Added ${f.name}`);
  },
  editEntry: el => { editId = el.dataset.id; openSheet(sheetEditEntry); },
  saveEntry: () => { const e = dayEntries(ui.day).find(x => x.id === editId); const q = num('qty', e.qty); if (q > 0) e.qty = q; e.meal = $('#eMeal').value; save(); closeSheet(); render(); },
  deleteEntry: () => { S.log[ui.day] = dayEntries(ui.day).filter(x => x.id !== editId); save(); closeSheet(); render(); toast('Entry deleted'); },
  closeSheet: () => closeSheet(),

  startWorkout: () => newActive('Workout', []),
  startRoutine: el => { const r = S.routines.find(x => x.id === el.dataset.id); newActive(r.name, r.exercises); },
  addExercise: () => { Object.assign(pick, { mode: 'active', q: '', creating: false }); openSheet(sheetPickExercise); },
  pickCreate: el => { pick.creating = el.dataset.v === '1'; drawSheet(); },
  chooseEx: el => addExTo(el.dataset.id),
  removeEx: el => { S.active.exercises.splice(+el.dataset.i, 1); save(); render(); },
  addSet: el => { const e = S.active.exercises[+el.dataset.i]; const last = e.sets[e.sets.length - 1]; e.sets.push({ w: last ? last.w : '', r: '', done: false }); save(); render(); },
  removeSet: el => { S.active.exercises[+el.dataset.i].sets.pop(); save(); render(); },
  toggleSet: el => {
    const i = +el.dataset.i, j = +el.dataset.j, e = S.active.exercises[i], s = e.sets[j];
    if (!s.done) {
      const prev = prevSets(e.ex)[j];
      if ((s.r === '' || s.r == null) && prev) s.r = prev.r;
      if ((s.w === '' || s.w == null) && prev) s.w = prev.w;
      if (!(Number(s.r) > 0)) { toast('Enter reps for this set first.'); return; }
      s.done = true; startRest();
    } else s.done = false;
    save(); render();
  },
  finishWorkout: () => finishWorkout(),
  discardAsk: () => { ui.confirmDiscard = true; render(); },
  discardNo: () => { ui.confirmDiscard = false; render(); },
  discardYes: () => { S.active = null; ui.rest = null; ui.confirmDiscard = false; save(); render(); toast('Workout discarded'); },
  restAdj: el => { if (ui.rest) { ui.rest.end += +el.dataset.n * 1000; ui.rest.total = Math.max(ui.rest.total, (ui.rest.end - Date.now()) / 1000); tick(); } },
  restSkip: () => { ui.rest = null; tick(); },

  editRoutine: el => {
    const r = S.routines.find(x => x.id === el.dataset.id);
    Object.assign(rt, r ? { id: r.id, name: r.name, ex: [...r.exercises] } : { id: null, name: '', ex: [] }, { q: '', confirmDel: false });
    openSheet(sheetRoutine);
  },
  rtSave: () => {
    if (!rt.name.trim()) { toast('Give the routine a name.'); return; }
    if (!rt.ex.length) { toast('Pick at least one exercise.'); return; }
    const r = S.routines.find(x => x.id === rt.id);
    if (r) { r.name = rt.name.trim(); r.exercises = [...rt.ex]; } else S.routines.push({ id: uid(), name: rt.name.trim(), exercises: [...rt.ex] });
    save(); closeSheet(); render(); toast('Routine saved');
  },
  rtDelAsk: () => { rt.confirmDel = true; drawSheet(); },
  rtDelNo: () => { rt.confirmDel = false; drawSheet(); },
  rtDelYes: () => { S.routines = S.routines.filter(x => x.id !== rt.id); save(); closeSheet(); render(); toast('Routine deleted'); },

  viewWorkout: el => { viewId = el.dataset.id; confirmDelW = false; openSheet(sheetWorkout); },
  wDelAsk: () => { confirmDelW = true; drawSheet(); },
  wDelNo: () => { confirmDelW = false; drawSheet(); },
  wDelYes: () => { S.workouts = S.workouts.filter(x => x.id !== viewId); save(); closeSheet(); render(); toast('Workout deleted'); },
  wAsRoutine: () => { const w = S.workouts.find(x => x.id === viewId); Object.assign(rt, { id: null, name: w.name, ex: w.exercises.map(e => e.ex), q: '', confirmDel: false }); openSheet(sheetRoutine); },
  wRepeat: () => {
    if (S.active) { toast('Finish or discard your current workout first.'); return; }
    const w = S.workouts.find(x => x.id === viewId); closeSheet(); newActive(w.name, w.exercises.map(e => e.ex));
  },

  units: el => { S.settings.units = el.dataset.u; save(); render(); },
  exportData: () => openSheet(sheetExport),
  copyExport: () => {
    const t = $('#exportTxt');
    const fallback = () => { t.focus(); t.select(); toast('Selected. Use your device’s Copy.'); };
    try { navigator.clipboard.writeText(t.value).then(() => toast('Backup copied'), fallback); } catch (e) { fallback(); }
  },
  importData: () => openSheet(sheetImport),
  doImport: () => {
    const err = $('#importErr');
    try {
      const d = JSON.parse($('#importTxt').value);
      if (!d || typeof d !== 'object' || !d.settings || !Array.isArray(d.workouts)) throw new Error('shape');
      S = normalize(d); save(); closeSheet(); render(); toast('Backup restored');
    } catch (e) { err.hidden = false; err.textContent = 'That text isn’t a valid backup. Copy the whole backup, from the first { to the last }, and try again.'; }
  },
  resetAsk: () => { ui.confirmReset = true; render(); },
  resetNo: () => { ui.confirmReset = false; render(); },
  resetYes: () => { S = defaults(); ui.confirmReset = false; ui.rest = null; save(); render(); toast('All data erased'); }
};

function addExTo(id) {
  if (pick.mode === 'active' && S.active) { S.active.exercises.push({ ex: id, sets: blankSets(id) }); save(); closeSheet(); render(); }
}

const ins = {
  foodQ: el => { add.q = el.value; $('#foodResults').innerHTML = foodResults(); },
  exQ: el => { pick.q = el.value; $('#exResults').innerHTML = exResults(); },
  qty: el => {
    const q = parseFloat(el.value) || 0;
    const f = add.pick && ui.sheet === sheetAddFood ? S.foods.find(x => x.id === add.pick) : dayEntries(ui.day).find(x => x.id === editId);
    if (f) $('#pickMacros').innerHTML = pickMacros(f, q);
    if (ui.sheet === sheetAddFood) add.qty = q || 1;
  },
  wName: el => { S.active.name = el.value; save(); },
  setW: el => { const s = S.active.exercises[+el.dataset.i].sets[+el.dataset.j]; const v = parseFloat(el.value); s.w = isFinite(v) ? fromDisp(v) : ''; save(); },
  setR: el => { const s = S.active.exercises[+el.dataset.i].sets[+el.dataset.j]; const v = parseInt(el.value, 10); s.r = isFinite(v) ? v : ''; save(); },
  rest: el => { S.settings.rest = +el.value; save(); },
  rtName: el => { rt.name = el.value; },
  rtQ: el => { rt.q = el.value; const pos = el.selectionStart; drawSheet(); const n = $('#rtQ'); n.focus(); n.setSelectionRange(pos, pos); },
  rtEx: el => { const id = el.dataset.id; rt.ex = el.checked ? [...rt.ex.filter(x => x !== id), id] : rt.ex.filter(x => x !== id); const keep = $('#rtList').scrollTop; drawSheet(); $('#rtList').scrollTop = keep; }
};

const forms = {
  weight: () => {
    const v = num('bwIn', NaN); if (!(v > 0)) { toast('Enter your weight as a number.'); return; }
    const k = today(); S.weights = S.weights.filter(w => w.date !== k); S.weights.push({ date: k, kg: Math.round(fromDisp(v) * 100) / 100 });
    save(); render(); toast(`Logged ${v} ${U()}`);
  },
  goals: () => {
    const g = { cal: Math.round(num('gCal')), p: Math.round(num('gP')), c: Math.round(num('gC')), f: Math.round(num('gF')) };
    if (!(g.cal > 0)) { toast('Set a calorie target above zero.'); return; }
    S.settings.goals = g; save(); render(); toast('Targets saved');
  },
  calc: () => {
    const sex = $('#cSex').value, age = num('cAge', 30);
    const cm = U() === 'lb' ? (num('cFt') * 12 + num('cIn')) * 2.54 : num('cCm', 175);
    const kg = fromDisp(num('cWt', 0)), act = +$('#cAct').value, goal = $('#cGoal').value;
    if (!(kg > 0 && cm > 0 && age > 0)) { toast('Fill in age, height and weight.'); return; }
    S.settings.profile = { sex, age, cm: Math.round(cm), act, goal }; save();
    const bmr = 10 * kg + 6.25 * cm - 5 * age + (sex === 'm' ? 5 : -161);
    const tdee = bmr * act, cal = Math.round(tdee * ({ cut: 0.8, maintain: 1, bulk: 1.1 }[goal]) / 10) * 10;
    const p = Math.round(kg * (goal === 'cut' ? 2.2 : 2.0)), f = Math.round(cal * 0.25 / 9), c = Math.max(0, Math.round((cal - p * 4 - f * 9) / 4));
    ui.calc = { cal, p, c, f };
    const out = $('#calcOut'); out.hidden = false;
    out.innerHTML = `<div class="calc-out"><span class="hint">Estimated daily burn: ${Math.round(tdee).toLocaleString()} kcal</span>
      <div class="macro-line"><span><b>${cal.toLocaleString()}</b> kcal</span><span style="color:var(--p)"><b>${p}</b> g protein</span><span style="color:var(--c)"><b>${c}</b> g carbs</span><span style="color:var(--f)"><b>${f}</b> g fat</span></div>
      <button type="button" class="btn primary" data-act="applyCalc">Use these targets</button></div>`;
  },
  quick: () => {
    const name = $('#qName').value.trim(); if (!name) { toast('Give the food a name.'); return; }
    const p = num('qP'), c = num('qC'), f = num('qF'); let cal = num('qCal', NaN);
    if (!isFinite(cal)) cal = Math.round(p * 4 + c * 4 + f * 9);
    const food = { id: 'f-' + uid(), name, serving: $('#qServ').value.trim() || '1 serving', cal, p, c, f, used: Date.now() };
    if ($('#qSave').checked) S.foods.push(food);
    (S.log[ui.day] ||= []).push(entryFrom(food, add.meal, 1));
    save(); closeSheet(); render(); toast(`Added ${name}`);
  },
  newEx: () => {
    const name = $('#nxName').value.trim(); if (!name) return;
    const ex = { id: 'x-' + uid(), name, muscle: $('#nxMuscle').value }; S.exercises.push(ex); save();
    pick.creating = false; addExTo(ex.id);
  }
};
acts.applyCalc = () => { if (ui.calc) { S.settings.goals = { ...ui.calc }; save(); render(); toast('Targets updated'); } };

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && acts[el.dataset.act] && !el.disabled) { e.preventDefault(); acts[el.dataset.act](el, e); } });
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && ins[el.dataset.in] && el.type !== 'checkbox' && el.tagName !== 'SELECT') ins[el.dataset.in](el); });
document.addEventListener('change', e => { const el = e.target.closest('[data-in]'); if (el && ins[el.dataset.in] && (el.type === 'checkbox' || el.tagName === 'SELECT')) ins[el.dataset.in](el); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (f) { e.preventDefault(); forms[f.dataset.form](); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });

fromHash();
})();
</script>
